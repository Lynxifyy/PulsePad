name: Build

# Builds the debug and release APKs and, on a tag, attaches the release APK to a
# GitHub release so the in-app updater has something to download.
#
# The integrity gate runs first and the build job `needs` it, so a repository with
# an unfinished file, an unwired class or a forbidden dependency never produces an
# artifact - the check is a real gate, not a parallel report.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Repository integrity gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The checker enumerates every tracked file, so it needs the full tree.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan every tracked file
        run: python3 scripts/check_repo_integrity.py

  build:
    name: Assemble APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The gate above blocks this job: no clean scan, no APK.
    needs: integrity
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platforms and build tools
        run: |
          sdkmanager --install "platforms;android-35" "platforms;android-36" \
            "platforms;android-37" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive the version from the tag
        id: version
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          # versionCode must strictly increase across releases; the run number is
          # monotonic, so it is a safe base.
          code="${GITHUB_RUN_NUMBER:-1}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "Building version ${name} (code ${code})"

      - name: Materialise the release keystore
        # Absent when the repository has no signing secrets configured. The build
        # then falls back to the debug key, which is fine for sideloading a
        # test build but means those APKs cannot update one another.
        if: ${{ secrets.PULSEPAD_KEYSTORE_BASE64 != '' }}
        env:
          PULSEPAD_KEYSTORE_BASE64: ${{ secrets.PULSEPAD_KEYSTORE_BASE64 }}
        run: |
          echo "$PULSEPAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pulsepad.jks"
          echo "PULSEPAD_KEYSTORE_PATH=$RUNNER_TEMP/pulsepad.jks" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --console=plain

      - name: Build debug and release APKs
        env:
          PULSEPAD_KEYSTORE_PASSWORD: ${{ secrets.PULSEPAD_KEYSTORE_PASSWORD }}
          PULSEPAD_KEY_ALIAS: ${{ secrets.PULSEPAD_KEY_ALIAS }}
          PULSEPAD_KEY_PASSWORD: ${{ secrets.PULSEPAD_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease --console=plain \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"

      - name: Verify the APKs are real, installable archives
        run: |
          python3 - <<'PY'
          import sys, zipfile

          required_models = {
              "assets/models/dualshock4.glb",
              "assets/models/dualsense.glb",
              "assets/models/xbox_wireless.glb",
          }
          failed = False
          for variant in ("debug", "release"):
              apk = f"app/build/outputs/apk/{variant}/app-{variant}.apk"
              try:
                  archive = zipfile.ZipFile(apk)
              except (FileNotFoundError, zipfile.BadZipFile) as error:
                  print(f"{apk}: {error}")
                  failed = True
                  continue
              names = set(archive.namelist())
              # A truncated or empty APK fails testzip before anything else.
              if archive.testzip() is not None:
                  print(f"{apk}: corrupt zip entry")
                  failed = True
              if "AndroidManifest.xml" not in names:
                  print(f"{apk}: no AndroidManifest.xml")
                  failed = True
              if not any(n.startswith("classes") and n.endswith(".dex") for n in names):
                  print(f"{apk}: no dex payload")
                  failed = True
              missing = required_models - names
              if missing:
                  print(f"{apk}: missing controller models {sorted(missing)}")
                  failed = True
              print(f"{apk}: {len(names)} entries, ok")
          sys.exit(1 if failed else 0)
          PY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pulsepad-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: pulsepad-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release APK to a GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
